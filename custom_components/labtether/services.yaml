run_action:
  name: Run Action
  description: Run an approved power action on a LabTether-managed asset. Administrator only.
  fields:
    asset_id:
      name: Asset ID
      description: The LabTether asset ID to run the action on.
      required: true
      selector:
        text:
    action:
      name: Action
      description: "An approved power action (vm.start, vm.stop, container.start, or container.stop)."
      required: true
      selector:
        text:
    entry_id:
      name: Hub entry ID
      description: "The Home Assistant config entry ID for the target LabTether hub. Required when more than one hub exposes the same asset ID."
      required: false
      selector:
        config_entry:
          integration: labtether
    connector_id:
      name: Connector ID
      description: "The connector that owns the action (e.g. proxmox, truenas)."
      required: false
      selector:
        text:
    params:
      name: Parameters
      description: Optional parameters for the action.
      required: false
      selector:
        object:

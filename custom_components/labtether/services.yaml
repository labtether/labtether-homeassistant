run_action:
  name: Run action
  description: Start or stop a VM or container through LabTether. Administrators only.
  fields:
    asset_id:
      name: Device ID
      description: The device's LabTether ID, for example pve-vm-100.
      required: true
      selector:
        text:
    action:
      name: Action
      description: "vm.start or vm.stop for VMs, ct.start or ct.stop for Proxmox containers, container.start or container.stop for Docker containers. On Proxmox, vm.shutdown and ct.shutdown ask the guest to shut down."
      required: true
      selector:
        text:
    entry_id:
      name: Hub
      description: The LabTether hub that has the device. Needed when more than one hub has the same device ID.
      required: false
      selector:
        config_entry:
          integration: labtether
    connector_id:
      name: Connector
      description: "The connector that runs the action, for example proxmox or truenas. It must match the device's source."
      required: false
      selector:
        text:
    params:
      name: Parameters
      description: Not supported. Calls with parameters are rejected.
      required: false
      selector:
        object:

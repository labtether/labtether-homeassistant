name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || (github.event_name == 'push' && github.ref_type == 'branch' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_type == 'branch') }}

permissions:
  contents: read

jobs:
  line-limit:
    name: Handwritten code / 500-line limit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check line-limit gate behavior
        run: python3 -m unittest scripts/ci/test_line_limit.py
      - name: Enforce full-repository line limit
        run: python3 scripts/ci/check-line-limit.py
      - name: Block personal details
        run: python3 scripts/ci/check-private-info.py

  qa-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      checks_required: ${{ steps.select.outputs.checks_required }}
      contracts: ${{ steps.select.outputs.contracts }}
      mode: ${{ steps.select.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test QA contract selector
        run: ./scripts/ci/test-select-qa-contracts.sh

      - name: Select risk-based QA contracts
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          mode="auto"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" || "${GITHUB_REF_TYPE}" == "tag" ]]; then
            mode="full"
          fi
          args=(--mode "${mode}" --head "${GITHUB_SHA}")
          # Manual and tag runs have no base commit; omit it rather than pass "".
          if [[ -n "${BASE_SHA:-}" ]]; then
            args+=(--base "${BASE_SHA}")
          fi
          ./scripts/ci/select-qa-contracts.sh "${args[@]}"

  test:
    name: test (${{ matrix.python-label }})
    needs: [line-limit, qa-contracts]
    if: >-
      !cancelled() && (needs.line-limit.result != 'success' ||
      needs.qa-contracts.result != 'success' || needs.qa-contracts.outputs.checks_required != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - python-label: "3.12"
            python-version: "3.12.16"
          - python-label: "3.14"
            python-version: "3.14.9"
    steps:
      - name: Require source-size and selection gates
        shell: bash
        env:
          LINE_LIMIT_RESULT: ${{ needs.line-limit.result }}
          SELECTION_RESULT: ${{ needs.qa-contracts.result }}
        run: |
          test "${LINE_LIMIT_RESULT}" = success
          test "${SELECTION_RESULT}" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --require-hashes --requirement requirements-dev.txt

      - name: Verify dependency environment
        run: python -m pip check

      - name: Run tests
        run: python -m pytest tests/ -v

  addon-container-security:
    needs: qa-contracts
    if: >-
      needs.qa-contracts.outputs.checks_required != 'false' &&
      contains(format(',{0},', needs.qa-contracts.outputs.contracts), ',addon-installed-container,')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify immutable build inputs and unprivileged hub runtime
        run: ./tests/addon_container_security_test.sh

  home-assistant-disposable-tls:
    needs: qa-contracts
    if: needs.qa-contracts.outputs.checks_required != 'false' && contains(format(',{0},', needs.qa-contracts.outputs.contracts), ',ha-disposable-tls,')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.9"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install disposable QA dependencies
        run: python -m pip install --require-hashes --requirement requirements-dev.txt

      - name: Run installed Home Assistant lifecycle against disposable TLS hub
        env:
          LABTETHER_LIVE_HA_QA: "1"
          LABTETHER_QA_PYTHON: python
        run: ./tests/ha_core_live_test.sh

  ci-result:
    name: CI result
    needs: [line-limit, qa-contracts, test, addon-container-security, home-assistant-disposable-tls]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every selected check to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          jobs = json.loads(os.environ["NEEDS_JSON"])
          required = {"line-limit", "qa-contracts"}
          owners = {
              "addon-installed-container": "addon-container-security",
              "ha-disposable-tls": "home-assistant-disposable-tls",
          }
          if not isinstance(jobs, dict) or set(jobs) != required | {"test"} | set(owners.values()):
              sys.exit("CI results do not contain the complete expected job set")
          outputs = jobs["qa-contracts"]["outputs"]
          checks = outputs.get("checks_required")
          contracts = outputs.get("contracts", "")
          if checks not in ("true", "false") or not isinstance(contracts, str):
              sys.exit("QA selection did not produce a valid check plan")
          selected = set(contracts.split(",")) - {""}
          if selected - owners.keys():
              sys.exit("QA selection contains a contract without a CI check")
          # Add-on docs match a contract glob but still skip source checks.
          # Match the job predicates: both checks and contract must be enabled.
          if checks == "true":
              required.add("test")
              required.update(owners[contract] for contract in selected)
          failed = [name for name, job in jobs.items()
                    if job["result"] not in (("success",) if name in required else ("success", "skipped"))]
          if failed:
              sys.exit("CI failed: " + ", ".join(sorted(failed)))
          print("All required CI checks passed.")
          PY

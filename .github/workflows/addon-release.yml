name: Home Assistant Add-on Release

# Publishing runs only from a release tag. A manual run could build any
# branch under a released version and overwrite what Supervisor installs. To
# retry a failed release, re-run the tag's workflow run.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Two release runs must not race to move :latest or the hosted repository.
concurrency:
  group: addon-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      owner_lc: ${{ steps.meta.outputs.owner_lc }}
      newest: ${{ steps.meta.outputs.newest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # All tags, to tell whether this is the newest release.
          fetch-depth: 0

      # The tag also selects ghcr.io/labtether/labtether:<tag>, so an HA tag
      # must be a plain release version that matches the shipped metadata.
      - name: Require release tag to match integration and add-on versions
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag ${GITHUB_REF_NAME} must look like v1.2.3" >&2
            exit 1
          fi
          expected="${GITHUB_REF_NAME#v}"
          for file in custom_components/labtether/manifest.json addon/labtether/config.json; do
            actual="$(jq -r '.version' "${file}")"
            if [[ "${actual}" != "${expected}" ]]; then
              echo "${file} version ${actual} does not match tag ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
          done

      - name: Resolve release metadata
        id: meta
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          owner_lc="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"

          # Only the newest release moves :latest and the hosted repository, so
          # a patch for an older line cannot downgrade existing installs.
          newest_tag="$(git tag --list 'v*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"
          newest="false"
          if [[ "${newest_tag}" == "${GITHUB_REF_NAME}" ]]; then
            newest="true"
          fi

          {
            echo "version=${version}"
            echo "owner_lc=${owner_lc}"
            echo "newest=${newest}"
          } >> "$GITHUB_OUTPUT"

  build-addon-images:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            base_image: ghcr.io/home-assistant/amd64-base:3.24@sha256:20d9028d56eaa3dd3013f6e0a7957b4911e4c71e14f85d1f609bba4fe429e84a
          - arch: aarch64
            platform: linux/arm64
            base_image: ghcr.io/home-assistant/aarch64-base:3.24@sha256:aacbf5d8c17fe5682b0d0bc5a523cd14cbd5481bd9124eb312d8aa2e9d796840
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve immutable hub image
        id: hub-image
        env:
          HUB_IMAGE_TAG: ghcr.io/${{ needs.prepare.outputs.owner_lc }}/labtether:v${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "${HUB_IMAGE_TAG}" --format '{{.Manifest.Digest}}')"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "failed to resolve an immutable hub image digest" >&2
            exit 1
          fi
          echo "reference=${HUB_IMAGE_TAG}@${digest}" >> "${GITHUB_OUTPUT}"

      - name: Build and push addon image (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: addon/labtether/Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_FROM=${{ matrix.base_image }}
            HUB_IMAGE=${{ steps.hub-image.outputs.reference }}
          tags: |
            ghcr.io/${{ needs.prepare.outputs.owner_lc }}/labtether-homeassistant-addon-${{ matrix.arch }}:${{ needs.prepare.outputs.version }}
            ${{ needs.prepare.outputs.newest == 'true' && format('ghcr.io/{0}/labtether-homeassistant-addon-{1}:latest', needs.prepare.outputs.owner_lc, matrix.arch) || '' }}
          labels: |
            org.opencontainers.image.title=LabTether Home Assistant Add-on
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true

      - name: Attest pushed add-on image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ needs.prepare.outputs.owner_lc }}/labtether-homeassistant-addon-${{ matrix.arch }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  package-addon-repository:
    needs: [prepare, build-addon-images]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require public pull access for both add-on images
        env:
          IMAGE_PREFIX: ghcr.io/${{ needs.prepare.outputs.owner_lc }}/labtether-homeassistant-addon
          ADDON_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 scripts/release/check_public_image.py \
            --image "${IMAGE_PREFIX}-amd64:${ADDON_VERSION}" \
            --image "${IMAGE_PREFIX}-aarch64:${ADDON_VERSION}"

      - name: Package Home Assistant repository layout
        env:
          ADDON_VERSION: ${{ needs.prepare.outputs.version }}
          IMAGE_PREFIX: ghcr.io/${{ needs.prepare.outputs.owner_lc }}/labtether-homeassistant-addon
        run: |
          ./scripts/release/package-ha-addon-repo.sh \
            --version "${ADDON_VERSION}" \
            --image-prefix "${IMAGE_PREFIX}" \
            --output-dir "./dist/ha-addon-repository"

      - name: Upload add-on repository artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homeassistant-addon-repository-${{ needs.prepare.outputs.version }}
          path: |
            dist/ha-addon-repository
            dist/labtether-ha-addon-repository-${{ needs.prepare.outputs.version }}.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Attest add-on repository provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/labtether-ha-addon-repository-${{ needs.prepare.outputs.version }}.tar.gz

      - name: Attach add-on repository tarball to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/labtether-ha-addon-repository-${{ needs.prepare.outputs.version }}.tar.gz

      - name: Publish hosted add-on repository branch
        if: needs.prepare.outputs.newest == 'true'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: homeassistant-addon-repo
          publish_dir: ./dist/ha-addon-repository
          force_orphan: true
          enable_jekyll: false
          commit_message: "release: Home Assistant add-on repo ${{ needs.prepare.outputs.version }}"

name: Home Assistant Add-on Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Add-on version override (defaults to tag name without leading v)"
        required: false
        type: string
      publish_repo_branch:
        description: "Publish hosted addon repository branch"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      owner_lc: ${{ steps.meta.outputs.owner_lc }}
      publish_repo_branch: ${{ steps.meta.outputs.publish_repo_branch }}
    steps:
      - name: Resolve release metadata
        id: meta
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_PUBLISH: ${{ github.event.inputs.publish_repo_branch }}
        run: |
          set -euo pipefail

          version="${INPUT_VERSION:-}"

          if [[ -z "${version}" ]]; then
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              version="${GITHUB_REF_NAME#v}"
            else
              version="${GITHUB_SHA::12}"
            fi
          fi

          owner_lc="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"

          publish_repo_branch="true"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${INPUT_PUBLISH}" == "false" ]]; then
            publish_repo_branch="false"
          fi

          {
            echo "version=${version}"
            echo "owner_lc=${owner_lc}"
            echo "publish_repo_branch=${publish_repo_branch}"
          } >> "$GITHUB_OUTPUT"

  build-addon-images:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            base_image: ghcr.io/home-assistant/amd64-base:3.24@sha256:3d488926053a19c806784c86ab300de0d4b2f7a2b2298948d692d93aec0ad743
          - arch: aarch64
            platform: linux/arm64
            base_image: ghcr.io/home-assistant/aarch64-base:3.24@sha256:ad54e0fd964af2f3a829b4d7c3fe504b59a6852d2c5304fde8711a39b1631e9a
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve immutable hub image
        id: hub-image
        env:
          HUB_IMAGE_TAG: ghcr.io/${{ needs.prepare.outputs.owner_lc }}/labtether:v${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "${HUB_IMAGE_TAG}" --format '{{.Manifest.Digest}}')"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "failed to resolve an immutable hub image digest" >&2
            exit 1
          fi
          echo "reference=${HUB_IMAGE_TAG}@${digest}" >> "${GITHUB_OUTPUT}"

      - name: Build and push addon image (${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: addon/labtether/Dockerfile
          push: true
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_FROM=${{ matrix.base_image }}
            HUB_IMAGE=${{ steps.hub-image.outputs.reference }}
          tags: |
            ghcr.io/${{ needs.prepare.outputs.owner_lc }}/labtether-homeassistant-addon-${{ matrix.arch }}:${{ needs.prepare.outputs.version }}
            ghcr.io/${{ needs.prepare.outputs.owner_lc }}/labtether-homeassistant-addon-${{ matrix.arch }}:latest
          labels: |
            org.opencontainers.image.title=LabTether Home Assistant Add-on
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true

      - name: Attest pushed add-on image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ needs.prepare.outputs.owner_lc }}/labtether-homeassistant-addon-${{ matrix.arch }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  package-addon-repository:
    needs: [prepare, build-addon-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require public pull access for both add-on images
        env:
          IMAGE_PREFIX: ghcr.io/${{ needs.prepare.outputs.owner_lc }}/labtether-homeassistant-addon
          ADDON_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 scripts/release/check_public_image.py \
            --image "${IMAGE_PREFIX}-amd64:${ADDON_VERSION}" \
            --image "${IMAGE_PREFIX}-aarch64:${ADDON_VERSION}"

      - name: Package Home Assistant repository layout
        env:
          ADDON_VERSION: ${{ needs.prepare.outputs.version }}
          IMAGE_PREFIX: ghcr.io/${{ needs.prepare.outputs.owner_lc }}/labtether-homeassistant-addon
        run: |
          ./scripts/release/package-ha-addon-repo.sh \
            --version "${ADDON_VERSION}" \
            --image-prefix "${IMAGE_PREFIX}" \
            --output-dir "./dist/ha-addon-repository"

      - name: Upload add-on repository artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: homeassistant-addon-repository-${{ needs.prepare.outputs.version }}
          path: |
            dist/ha-addon-repository
            dist/labtether-ha-addon-repository-${{ needs.prepare.outputs.version }}.tar.gz
          if-no-files-found: error

      - name: Attest add-on repository provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/labtether-ha-addon-repository-${{ needs.prepare.outputs.version }}.tar.gz

      - name: Attach add-on repository tarball to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/labtether-ha-addon-repository-${{ needs.prepare.outputs.version }}.tar.gz

      - name: Publish hosted add-on repository branch
        if: needs.prepare.outputs.publish_repo_branch == 'true'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: homeassistant-addon-repo
          publish_dir: ./dist/ha-addon-repository
          force_orphan: true
          enable_jekyll: false
          commit_message: "release: Home Assistant add-on repo ${{ needs.prepare.outputs.version }}"
